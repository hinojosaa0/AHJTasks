<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #17233B;
  --muted: #56627A;
  --faint: #8A95A7;
  --line: #D9DFE7;
  --mark: #F2C23A;
  --mark-soft: rgba(242, 194, 58, 0.45);
  --late: #B3402C;
  --focus: #2F5BD3;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1524;
    --surface: #161F33;
    --ink: #E7EBF3;
    --muted: #A2ACBF;
    --faint: #76819A;
    --line: #27324A;
    --mark: #E6B730;
    --mark-soft: rgba(230, 183, 48, 0.30);
    --late: #E88067;
    --focus: #7EA2FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1524;
  --surface: #161F33;
  --ink: #E7EBF3;
  --muted: #A2ACBF;
  --faint: #76819A;
  --line: #27324A;
  --mark: #E6B730;
  --mark-soft: rgba(230, 183, 48, 0.30);
  --late: #E88067;
  --focus: #7EA2FF;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 96px; }

/* Barra superior fija */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  padding: 18px 0 4px;
}
.meta-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin-bottom: 10px;
}
.today-label { font-weight: 700; font-size: 15px; }
.today-label span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.status { font-size: 13px; color: var(--faint); white-space: nowrap; }
.status.warn { color: var(--late); }

.capture {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 6px 6px 6px 16px;
  transition: border-color .15s;
}
.capture:focus-within { border-color: var(--ink); }
#cap {
  flex: 1; min-width: 0;
  border: 0; outline: none; background: transparent;
  font-size: 19px; font-weight: 500;
  padding: 10px 0;
}
#cap::placeholder { color: var(--faint); font-weight: 400; }
.chip {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--mark-soft);
  border-radius: 8px;
  padding: 3px 2px 3px 10px;
  font-size: 14px; font-weight: 600;
  white-space: nowrap;
}
.chip[hidden] { display: none; }
.chip button {
  border: 0; background: transparent; width: 26px; height: 26px; border-radius: 6px;
  color: var(--muted); font-size: 16px; line-height: 1;
}
.chip button:hover { color: var(--ink); }
.cal {
  position: relative; flex: none;
  width: 44px; height: 44px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--muted);
}
.cal:hover { color: var(--ink); background: var(--bg); }
.cal[hidden] { display: none; }
.cal input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; border: 0; padding: 0; margin: 0;
}
.cal input::-webkit-calendar-picker-indicator {
  position: absolute; inset: 0; width: auto; height: auto; cursor: pointer;
}

.hint-row {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 8px 4px 0; min-height: 40px;
}
.hint { font-size: 13px; color: var(--muted); }
.hint b { color: var(--ink); font-weight: 600; }
.kind {
  display: inline-flex; flex: none;
  border: 1px solid var(--line); border-radius: 9px; padding: 2px;
  background: var(--surface);
}
.kind button {
  border: 0; background: transparent; border-radius: 7px;
  padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.kind button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* Pestañas */
.tabs {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  margin: 10px -8px 0; padding: 0 0 6px;
  border-bottom: 1px solid var(--line);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; border: 0; background: transparent;
  padding: 8px 10px; font-size: 16px; font-weight: 600; color: var(--muted);
}
.tab .n { font-weight: 500; color: var(--faint); margin-left: 5px; font-size: 14px; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"] .label {
  background: linear-gradient(transparent 56%, var(--mark-soft) 56%, var(--mark-soft) 94%, transparent 94%);
  padding: 0 2px; margin: 0 -2px;
}
.tab:hover .label { color: var(--ink); }

/* Listas */
.sec {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  margin: 26px 2px 8px;
}
.sec h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--muted); }
.sec.late h2 { color: var(--late); }
.sec .link { font-size: 13px; }
.panel {
  list-style: none; margin: 0; padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.row + .row { border-top: 1px solid var(--line); }
.line { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; min-height: 50px; }
.check, .lead {
  width: 44px; height: 50px; border: 0; background: transparent;
  display: grid; place-items: center; padding: 0;
}
.box {
  width: 20px; height: 20px; border-radius: 50%;
  border: 1.5px solid var(--faint);
  display: grid; place-items: center; color: transparent;
  transition: background .15s, border-color .15s;
}
.check:hover .box { border-color: var(--ink); }
.row.done .box, .row.leaving .box { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.spark { width: 8px; height: 8px; background: var(--mark); transform: rotate(45deg); border-radius: 1px; }
.txt {
  border: 0; background: transparent; text-align: left;
  padding: 13px 8px 13px 2px; font-size: 16px; line-height: 1.35;
  overflow-wrap: anywhere; min-width: 0;
}
.notemark { color: var(--faint); font-size: 13px; margin-left: 6px; }
.meta { font-size: 13px; color: var(--faint); padding-right: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meta.late { color: var(--late); font-weight: 600; }
.row.done .txt { color: var(--faint); text-decoration: line-through; }
.row.leaving .txt { color: var(--faint); text-decoration: line-through; }
.row.leaving { opacity: .6; transition: opacity .35s; }
.row.fresh { animation: fresh 1.4s ease-out; }
@keyframes fresh { from { background: var(--mark-soft); } to { background: transparent; } }

.editor { padding: 2px 14px 14px 44px; display: grid; gap: 10px; }
.ed-title, .ed-note {
  width: 100%; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); padding: 9px 11px;
}
.ed-title { font-weight: 600; }
.ed-note { resize: vertical; min-height: 72px; font-size: 15px; }
.ed-title:focus, .ed-note:focus { outline: none; border-color: var(--ink); }
.ed-dates { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 12px; font-size: 14px; color: var(--ink);
}
.pill:hover { border-color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--mark-soft); border-color: var(--mark); font-weight: 600; }
.pill-date { padding: 5px 10px; }
.ed-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.ed-actions .btn { margin-left: auto; }
.link { border: 0; background: transparent; padding: 4px 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.link:hover { color: var(--ink); text-decoration-color: currentColor; }
.link.danger:hover { color: var(--late); }
.btn { border: 0; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 7px 16px; font-size: 14px; font-weight: 600; }

.empty { padding: 36px 6px; color: var(--muted); max-width: 46ch; }
.empty p { margin: 0 0 4px; }
.empty .big { font-size: 18px; font-weight: 600; color: var(--ink); }

details.donebox { margin-top: 26px; }
details.donebox summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); padding: 4px 2px 8px; list-style: none; }
details.donebox summary::-webkit-details-marker { display: none; }
details.donebox summary::before { content: "▸"; display: inline-block; width: 16px; color: var(--faint); transition: transform .15s; }
details.donebox[open] summary::before { transform: rotate(90deg); }

.foot .link { font-size: 13px; }
.foot { margin-top: 40px; font-size: 13px; color: var(--faint); }
.foot kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  z-index: 50;
  background: var(--ink); color: var(--surface);
  border-radius: 10px; padding: 8px 8px 8px 16px;
  display: flex; align-items: center; gap: 14px;
  font-size: 15px; max-width: calc(100vw - 32px);
  box-shadow: 0 6px 24px rgba(10, 20, 40, .22);
}
.toast[hidden] { display: none; }
.toast button { border: 0; background: transparent; color: var(--mark); font-weight: 700; padding: 6px 8px; border-radius: 6px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 520px) {
  .wrap { padding: 0 14px 96px; }
  #cap { font-size: 17px; }
  .hint-row { align-items: flex-start; }
  .editor { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="meta-row">
      <div class="today-label">Pendientes<span id="todayText"></span></div>
      <div class="status" id="status" role="status">Conectando…</div>
    </div>
    <div class="capture">
      <label for="cap" class="sr">Nueva tarea o idea</label>
      <input id="cap" type="text" autocomplete="off" enterkeyhint="done" placeholder="¿Qué tienes en mente?">
      <span class="chip" id="chip" hidden><span id="chipText"></span><button type="button" id="chipClear" aria-label="Quitar fecha">×</button></span>
      <span class="cal" id="calWrap" title="Elegir fecha">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8.5h14M7 2.5v4M13 2.5v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="date" id="capDate" aria-label="Elegir fecha">
      </span>
    </div>
    <div class="hint-row">
      <div class="hint" id="hint"></div>
      <div class="kind" role="group" aria-label="Tipo">
        <button type="button" data-kind="task" aria-pressed="true">Tarea</button>
        <button type="button" data-kind="idea" aria-pressed="false">Idea</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>

  <main id="list" aria-live="polite"></main>

  <p class="foot" id="foot"></p>
</div>

<div class="toast" id="toast" hidden role="status"><span id="toastText"></span><button type="button" id="toastBtn"></button></div>

<script>
(() => {
'use strict';

/* ---------- utilidades DOM ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(pointer: fine)').matches;

/* ---------- fechas ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysBetween = (a, b) => Math.round((fromYmd(a) - fromYmd(b)) / 86400000);
const nextDow = (from, dow) => { let diff = (dow - from.getDay() + 7) % 7; if (diff === 0) diff = 7; return addDays(from, diff); };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtShort = s => fromYmd(s).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/[.,]/g, '');
const fmtLong = s => cap1(fromYmd(s).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ''));

/* ---------- lector de fechas en español ---------- */
const strip = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const NUMW = { un: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, quince: 15 };
const WD = { domingo: 0, lunes: 1, martes: 2, miercoles: 3, jueves: 4, viernes: 5, sabado: 6 };
const MON = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11 };
const PRE = '(?:(?:para|antes\\s+del?|el|este|esta|la|pr[oó]xim[oa]|siguiente)\\s+){0,3}';
const MONTH_RE = '(ene(?:ro)?|feb(?:rero)?|mar(?:zo)?|abr(?:il)?|may(?:o)?|jun(?:io)?|jul(?:io)?|ago(?:sto)?|sep(?:t(?:iembre)?)?|set(?:iembre)?|oct(?:ubre)?|nov(?:iembre)?|dic(?:iembre)?)';
function safeDate(y, m, d) { const x = new Date(y, m, d); return x.getMonth() === ((m % 12) + 12) % 12 && x.getDate() === d ? x : null; }
function withYear(y, m, d, T, explicit) {
  let x = safeDate(y, m, d);
  if (x && !explicit && x < T) x = safeDate(y + 1, m, d);
  return x;
}
const RULES = [
  { re: 'pasado\\s+ma[nñ]ana', f: (m, T) => addDays(T, 2) },
  { re: '(?<!la\\s+)ma[nñ]ana', f: (m, T) => addDays(T, 1) },
  { re: 'hoy', f: (m, T) => T },
  { re: '(?:en|dentro\\s+de)\\s+(\\d{1,3}|un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|quince)\\s+(d[ií]as?|semanas?|mes(?:es)?)',
    f: (m, T) => {
      const n = /\d/.test(m[1]) ? +m[1] : NUMW[strip(m[1])];
      const u = strip(m[2]);
      if (u.startsWith('dia')) return addDays(T, n);
      if (u.startsWith('semana')) return addDays(T, 7 * n);
      const x = new Date(T.getFullYear(), T.getMonth() + n, 1);
      const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
      x.setDate(Math.min(T.getDate(), last));
      return x;
    } },
  { re: '(?:pr[oó]xima|siguiente|otra)\\s+semana', f: (m, T) => nextDow(T, 1) },
  { re: 'fin\\s+de\\s+mes', f: (m, T) => new Date(T.getFullYear(), T.getMonth() + 1, 0) },
  { re: 'fin\\s+de\\s+semana', f: (m, T) => T.getDay() === 6 ? T : nextDow(T, 6) },
  { re: '(domingo|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado)', f: (m, T) => nextDow(T, WD[strip(m[1])]) },
  { re: '(\\d{1,2})[/-](\\d{1,2})(?:[/-](\\d{4}|\\d{2}))?',
    f: (m, T) => {
      const d = +m[1], mo = +m[2] - 1;
      if (mo < 0 || mo > 11) return null;
      const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : T.getFullYear();
      return withYear(y, mo, d, T, !!m[3]);
    } },
  { re: '(\\d{1,2})\\s+(?:de\\s+)?' + MONTH_RE + '\\.?(?:\\s+(?:de\\s+)?(\\d{4}))?',
    f: (m, T) => {
      const mo = MON[strip(m[2]).slice(0, 3)];
      const y = m[3] ? +m[3] : T.getFullYear();
      return withYear(y, mo, +m[1], T, !!m[3]);
    } },
].map(r => ({ ...r, rx: new RegExp('(?<![\\p{L}\\d])' + PRE + '(?:' + r.re + ')(?![\\p{L}\\d])', 'giu') }));

function parseDate(text, T = today()) {
  let best = null;
  for (const r of RULES) {
    r.rx.lastIndex = 0;
    let m;
    while ((m = r.rx.exec(text))) {
      const d = r.f(m, T);
      if (!d) continue;
      const start = m.index, end = m.index + m[0].length;
      if (!best || end > best.end || (end === best.end && start < best.start)) best = { date: ymd(d), start, end };
    }
  }
  return best;
}
function cleanTitle(s) {
  return s.replace(/\s+([,.;:])/g, '$1').replace(/\s{2,}/g, ' ').replace(/^[\s,;:–-]+|[\s,;:–-]+$/g, '').trim();
}

/* ---------- almacenamiento (Firebase + llave privada) ---------- */
const FB_CONFIG = {
  apiKey: "AIzaSyCELsFiOt_PZWgVluE4euT84tayWNZBypI",
  authDomain: "claude-task-manager-bc2f3.firebaseapp.com",
  databaseURL: "https://claude-task-manager-bc2f3-default-rtdb.firebaseio.com",
  projectId: "claude-task-manager-bc2f3",
  storageBucket: "claude-task-manager-bc2f3.appspot.com",
  messagingSenderId: "483389290422",
  appId: "1:483389290422:web:d48ab5bef1ce22390df317"
};
const CACHE_LS = 'pendientes.cache.v1';

const store = {
  items: new Map(), mode: 'init', ref: null, online: false, everConnected: false,
  init() {
    try {
      const raw = localStorage.getItem(CACHE_LS);
      if (raw) JSON.parse(raw).forEach(it => this.items.set(it.id, normalize(it.id, it)));
    } catch (e) { /* sin caché */ }
    if (typeof firebase === 'undefined') { this.mode = 'local'; changed(); return; }
    try {
      if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
      const db = firebase.database();
      this.ref = db.ref('pendientes/items');
      this.mode = 'db';
      db.ref('.info/connected').on('value', s => {
        this.online = !!s.val();
        if (this.online) this.everConnected = true;
        setStatus();
      });
      this.ref.on('value', snap => {
        const v = snap.val() || {};
        const m = new Map();
        Object.entries(v).forEach(([id, d]) => m.set(id, normalize(id, d)));
        this.items = m;
        this.saveCache();
        changed();
      }, err => { console.error(err); this.mode = 'error'; changed(); });
    } catch (e) { console.error(e); this.mode = 'local'; }
    changed();
  },
  saveCache() {
    try { localStorage.setItem(CACHE_LS, JSON.stringify([...this.items.values()])); } catch (e) { /* ignorado */ }
  },
  apply(op) {
    if (op.type === 'set') this.items.set(op.id, normalize(op.id, op.data));
    else if (op.type === 'update') { const cur = this.items.get(op.id); if (cur) this.items.set(op.id, { ...cur, ...op.data }); }
    else if (op.type === 'delete') this.items.delete(op.id);
    changed();
    this.saveCache();
    if (this.mode === 'db' && this.ref) {
      const r = this.ref.child(op.id);
      const p = op.type === 'set' ? r.set(op.data) : op.type === 'update' ? r.update(op.data) : r.remove();
      p.catch(e => { console.error(e); toast('No se pudo guardar el último cambio. Revisa las reglas de Firebase.'); });
    }
  },
  set(id, data) { this.apply({ type: 'set', id, data }); },
  update(id, data) { this.apply({ type: 'update', id, data }); },
  remove(id) { this.apply({ type: 'delete', id }); },
};
function normalize(id, d) {
  return {
    id,
    text: String(d.text || ''),
    kind: d.kind === 'idea' ? 'idea' : 'task',
    date: d.date || null,
    note: d.note || '',
    done: !!d.done,
    doneAt: d.doneAt || null,
    createdAt: d.createdAt || 0,
  };
}
const dataOf = it => ({ text: it.text, kind: it.kind, date: it.date, note: it.note, done: it.done, doneAt: it.doneAt, createdAt: it.createdAt });
const newId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- estado de la interfaz ---------- */
const TABS = [
  { id: 'hoy', label: 'Hoy' },
  { id: 'proximos', label: 'Próximos 7 días' },
  { id: 'sinfecha', label: 'Sin fecha' },
  { id: 'ideas', label: 'Ideas' },
];
const TAB_NAME = { hoy: 'Hoy', proximos: 'Próximos', sinfecha: 'Sin fecha', ideas: 'Ideas' };
const ui = { tab: 'hoy', openId: null, kind: 'task', manualDate: null, ignoreParse: false, dirty: false, leaving: new Set(), fresh: null, doneOpen: false };

function dest(it) {
  if (it.kind === 'idea') return 'ideas';
  if (!it.date) return 'sinfecha';
  return it.date <= ymd(today()) ? 'hoy' : 'proximos';
}

/* ---------- barra de captura ---------- */
const capEl = $('#cap'), chip = $('#chip'), chipText = $('#chipText'), capDate = $('#capDate'), calWrap = $('#calWrap'), hint = $('#hint');

function computeCapture() {
  const raw = capEl.value;
  const text = raw.trim();
  if (ui.kind === 'idea') return { title: text, date: null, kind: 'idea' };
  const parsed = (!ui.manualDate && !ui.ignoreParse) ? parseDate(raw) : null;
  const date = ui.manualDate || (parsed ? parsed.date : null);
  let title = parsed ? cleanTitle(raw.slice(0, parsed.start) + ' ' + raw.slice(parsed.end)) : text;
  if (!title) title = text;
  return { title, date, kind: 'task' };
}
function updateCapture() {
  const c = computeCapture();
  const isIdea = ui.kind === 'idea';
  calWrap.hidden = isIdea;
  if (!isIdea && c.date) { chip.hidden = false; chipText.textContent = fmtShort(c.date); }
  else chip.hidden = true;

  hint.replaceChildren();
  if (!capEl.value.trim()) {
    if (isIdea) hint.append('Las ideas van a su bandeja, sin fecha ni estructura');
    else hint.append('Escribe la fecha si la tiene: “mañana”, “viernes”, “15/10”' + (finePointer ? ' · Tab cambia a idea' : ''));
  } else {
    const d = dest(c);
    let where = TAB_NAME[d];
    if (d === 'proximos' && daysBetween(c.date, ymd(today())) > 7) where = 'Próximos, más adelante';
    hint.append('Enter lo guarda en ', h('b', null, where));
  }
}
function resetCapture() {
  ui.manualDate = null; ui.ignoreParse = false; capDate.value = '';
  updateCapture();
}
function setKind(k) {
  ui.kind = k;
  document.querySelectorAll('.kind button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.kind === k)));
  capEl.placeholder = k === 'idea' ? 'Anota una idea…' : '¿Qué tienes en mente?';
  updateCapture();
}
function submit() {
  const c = computeCapture();
  if (!c.title) return;
  const id = newId();
  const data = { text: c.title, kind: c.kind, date: c.date, note: '', done: false, doneAt: null, createdAt: Date.now() };
  ui.fresh = id;
  store.set(id, data);
  capEl.value = '';
  resetCapture();
  const d = dest(data);
  if (d !== ui.tab) toast(`Agregada a ${TAB_NAME[d]}`, 'Ver', () => switchTab(d));
}
capEl.addEventListener('input', () => {
  if (!capEl.value.trim()) { ui.ignoreParse = false; }
  updateCapture();
});
capEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); }
  else if (e.key === 'Tab' && !e.shiftKey && capEl.value.trim()) { e.preventDefault(); setKind(ui.kind === 'task' ? 'idea' : 'task'); }
  else if (e.key === 'Escape') { if (capEl.value) { capEl.value = ''; resetCapture(); } else capEl.blur(); }
});
$('#chipClear').addEventListener('click', () => {
  if (ui.manualDate) { ui.manualDate = null; capDate.value = ''; ui.ignoreParse = true; }
  else ui.ignoreParse = true;
  updateCapture(); capEl.focus();
});
capDate.addEventListener('change', () => {
  ui.manualDate = capDate.value || null;
  updateCapture(); capEl.focus();
});
document.querySelectorAll('.kind button').forEach(b => b.addEventListener('click', () => { setKind(b.dataset.kind); capEl.focus(); }));

/* ---------- pestañas ---------- */
const tabsEl = $('#tabs');
const tabBtns = {};
TABS.forEach(t => {
  const b = h('button', { class: 'tab', role: 'tab', type: 'button', 'aria-selected': String(t.id === ui.tab), onclick: () => switchTab(t.id) },
    h('span', { class: 'label' }, t.label), h('span', { class: 'n' }));
  tabBtns[t.id] = b; tabsEl.append(b);
});
function switchTab(id) {
  ui.tab = id; ui.openId = null;
  Object.entries(tabBtns).forEach(([k, b]) => b.setAttribute('aria-selected', String(k === id)));
  if (!capEl.value.trim()) setKind(id === 'ideas' ? 'idea' : 'task');
  render();
}

/* ---------- acciones sobre elementos ---------- */
function toggleDone(it) {
  if (it.done) { store.update(it.id, { done: false, doneAt: null }); return; }
  ui.leaving.add(it.id);
  render();
  setTimeout(() => {
    ui.leaving.delete(it.id);
    if (ui.openId === it.id) ui.openId = null;
    store.update(it.id, { done: true, doneAt: Date.now() });
    toast('Hecha', 'Deshacer', () => store.update(it.id, { done: false, doneAt: null }));
  }, reduceMotion ? 0 : 380);
}
function setDate(it, val) {
  const moved = { ...it, date: val };
  store.update(it.id, { date: val });
  const d = dest(moved);
  if (d !== ui.tab) {
    ui.openId = null;
    toast(`Movida a ${TAB_NAME[d]}${val ? ' · ' + fmtShort(val) : ''}`, 'Ver', () => switchTab(d));
    render();
  }
}
function convert(it) {
  if (it.kind === 'idea') {
    store.update(it.id, { kind: 'task', date: null });
    ui.openId = null;
    toast('Convertida en tarea', 'Ver', () => { switchTab('sinfecha'); ui.openId = it.id; render(); });
  } else {
    store.update(it.id, { kind: 'idea', date: null, done: false, doneAt: null });
    ui.openId = null;
    toast('Movida a Ideas', 'Ver', () => switchTab('ideas'));
  }
  render();
}
function del(it) {
  const copy = dataOf(it);
  ui.openId = null;
  store.remove(it.id);
  toast('Eliminada', 'Deshacer', () => store.set(it.id, copy));
}
function moveOverdueToToday(list) {
  const T = ymd(today());
  list.forEach(it => store.update(it.id, { date: T }));
  toast(list.length === 1 ? 'Pasada a hoy' : `${list.length} pasadas a hoy`);
}
function toggleOpen(id) { ui.openId = ui.openId === id ? null : id; render(); if (ui.openId) { const t = document.querySelector('.editor .ed-title'); if (t && finePointer) t.focus(); } }

/* ---------- renderizado ---------- */
const CHECK_SVG = '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function row(it, opts = {}) {
  const isIdea = it.kind === 'idea';
  const cls = ['row'];
  if (it.done) cls.push('done');
  if (ui.leaving.has(it.id)) cls.push('leaving');
  if (ui.fresh === it.id) cls.push('fresh');
  const li = h('li', { class: cls.join(' ') });
  let lead;
  if (isIdea) lead = h('span', { class: 'lead' }, h('span', { class: 'spark', 'aria-hidden': 'true' }));
  else {
    const box = h('span', { class: 'box' }); box.innerHTML = CHECK_SVG;
    lead = h('button', { class: 'check', type: 'button', 'aria-label': it.done ? 'Marcar como pendiente' : 'Marcar como hecha', onclick: () => toggleDone(it) }, box);
  }
  const txt = h('button', { class: 'txt', type: 'button', 'aria-expanded': String(ui.openId === it.id), onclick: () => toggleOpen(it.id) },
    it.text, it.note ? h('span', { class: 'notemark' }, '· notas') : null);
  const meta = h('span', { class: 'meta' + (opts.late ? ' late' : '') }, opts.meta || '');
  li.append(h('div', { class: 'line' }, lead, txt, meta));
  if (ui.openId === it.id) li.append(editor(it));
  return li;
}

function editor(it) {
  const isIdea = it.kind === 'idea';
  const T = today();
  const title = h('input', { class: 'ed-title', type: 'text', 'aria-label': 'Texto' });
  title.value = it.text;
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });
  title.addEventListener('change', () => {
    const v = title.value.trim();
    if (!v) { title.value = it.text; return; }
    if (v !== it.text) store.update(it.id, { text: v });
  });
  const note = h('textarea', { class: 'ed-note', rows: '3', placeholder: isIdea ? 'Desarrolla la idea…' : 'Notas', 'aria-label': 'Notas' });
  note.value = it.note || '';
  note.addEventListener('change', () => { if (note.value !== (it.note || '')) store.update(it.id, { note: note.value }); });

  const box = h('div', { class: 'editor' }, title, note);
  if (!isIdea) {
    const opts = [['Hoy', ymd(T)], ['Mañana', ymd(addDays(T, 1))], ['Próx. lunes', ymd(nextDow(T, 1))], ['Sin fecha', null]];
    const dates = h('div', { class: 'ed-dates', role: 'group', 'aria-label': 'Fecha' });
    opts.forEach(([label, val]) => dates.append(h('button', { type: 'button', class: 'pill', 'aria-pressed': String((it.date || null) === val), onclick: () => setDate(it, val) }, label)));
    const di = h('input', { type: 'date', class: 'pill pill-date', 'aria-label': 'Elegir otra fecha' });
    di.value = it.date || '';
    di.addEventListener('change', () => { if (di.value) setDate(it, di.value); });
    dates.append(di);
    box.append(dates);
  }
  box.append(h('div', { class: 'ed-actions' },
    h('button', { type: 'button', class: 'link', onclick: () => convert(it) }, isIdea ? 'Convertir en tarea' : 'Mover a ideas'),
    h('button', { type: 'button', class: 'link danger', onclick: () => del(it) }, 'Eliminar'),
    h('button', { type: 'button', class: 'btn', onclick: () => { ui.openId = null; render(); } }, 'Listo')));
  box.addEventListener('focusout', e => {
    if (!box.contains(e.relatedTarget)) setTimeout(() => { if (ui.dirty) render(); }, 0);
  });
  return box;
}

function section(title, items, metaFn, opts = {}) {
  const frag = document.createDocumentFragment();
  if (title) {
    frag.append(h('div', { class: 'sec' + (opts.late ? ' late' : '') }, h('h2', null, title), opts.action || null));
  } else frag.append(h('div', { style: 'height:18px' }));
  const ul = h('ul', { class: 'panel' });
  items.forEach(it => ul.append(row(it, metaFn ? metaFn(it) : {})));
  frag.append(ul);
  return frag;
}
function empty(big, small) {
  return h('div', { class: 'empty' }, h('p', { class: 'big' }, big), small ? h('p', null, small) : null);
}
function relAgo(n) {
  if (n === 1) return 'ayer';
  if (n < 14) return `hace ${n} días`;
  if (n < 60) return `hace ${Math.round(n / 7)} semanas`;
  return `hace ${Math.round(n / 30)} meses`;
}

function editorHasTyping() {
  const a = document.activeElement;
  return !!(a && a.closest && a.closest('.editor') && (a.classList.contains('ed-title') || a.classList.contains('ed-note')));
}

function render() {
  const T = ymd(today());
  const wk = ymd(addDays(today(), 7));
  const all = [...store.items.values()];
  const tasks = all.filter(i => i.kind === 'task');
  const open = tasks.filter(i => !i.done || ui.leaving.has(i.id));
  const byCreated = (a, b) => a.createdAt - b.createdAt;
  const overdue = open.filter(i => i.date && i.date < T).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  const dueToday = open.filter(i => i.date === T).sort(byCreated);
  const doneToday = tasks.filter(i => i.done && !ui.leaving.has(i.id) && i.doneAt && ymd(new Date(i.doneAt)) === T).sort((a, b) => b.doneAt - a.doneAt);
  const soon = open.filter(i => i.date && i.date > T && i.date <= wk).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  const later = open.filter(i => i.date && i.date > wk).sort((a, b) => a.date.localeCompare(b.date) || byCreated(a, b));
  const undated = open.filter(i => !i.date).sort((a, b) => b.createdAt - a.createdAt);
  const ideas = all.filter(i => i.kind === 'idea').sort((a, b) => b.createdAt - a.createdAt);

  const counts = { hoy: overdue.length + dueToday.length, proximos: soon.length + later.length, sinfecha: undated.length, ideas: ideas.length };
  Object.entries(counts).forEach(([k, n]) => { tabBtns[k].querySelector('.n').textContent = n ? String(n) : ''; });

  if (editorHasTyping()) { ui.dirty = true; return; }
  ui.dirty = false;

  const list = $('#list');
  list.replaceChildren();

  if (store.mode === 'init' && all.length === 0) {
    list.append(empty('Cargando tus pendientes…'));
    return;
  }

  if (ui.tab === 'hoy') {
    if (overdue.length) {
      list.append(section('Atrasadas', overdue, it => ({ meta: relAgo(daysBetween(T, it.date)), late: true }), {
        late: true,
        action: h('button', { type: 'button', class: 'link', onclick: () => moveOverdueToToday(overdue) }, overdue.length === 1 ? 'Pasar a hoy' : 'Pasar todas a hoy'),
      }));
    }
    if (dueToday.length) list.append(section(overdue.length ? 'Hoy' : null, dueToday));
    if (!overdue.length && !dueToday.length) {
      list.append(empty('Nada pendiente para hoy.', 'Escribe arriba lo que tengas en mente. Si le pones fecha, aparece aquí ese día.'));
    }
    if (doneToday.length) {
      const d = h('details', { class: 'donebox' });
      if (ui.doneOpen) d.open = true;
      d.addEventListener('toggle', () => { ui.doneOpen = d.open; });
      const ul = h('ul', { class: 'panel' });
      doneToday.forEach(it => ul.append(row(it)));
      d.append(h('summary', null, `Hechas hoy (${doneToday.length})`), ul);
      list.append(d);
    }
  } else if (ui.tab === 'proximos') {
    if (!soon.length && !later.length) list.append(empty('Nada en los próximos 7 días.', 'Las tareas con fecha futura aparecen aquí, agrupadas por día.'));
    const groups = new Map();
    soon.forEach(it => { if (!groups.has(it.date)) groups.set(it.date, []); groups.get(it.date).push(it); });
    groups.forEach((items, date) => {
      const n = daysBetween(date, T);
      list.append(section(n === 1 ? 'Mañana' : fmtLong(date), items));
    });
    if (later.length) list.append(section('Más adelante', later, it => ({ meta: fmtShort(it.date) })));
  } else if (ui.tab === 'sinfecha') {
    if (!undated.length) list.append(empty('No hay tareas sin fecha.', 'Todo lo que escribas sin fecha cae aquí y se queda visible hasta que lo termines.'));
    else list.append(section(null, undated, it => {
      const n = daysBetween(T, ymd(new Date(it.createdAt || Date.now())));
      return { meta: n >= 14 ? relAgo(n) : '' };
    }));
  } else {
    if (!ideas.length) list.append(empty('Tu bandeja de ideas está vacía.', 'Desde esta pestaña, lo que escribas arriba se guarda como idea. Cuando una madure, conviértela en tarea.'));
    else list.append(section(null, ideas));
  }
  ui.fresh = null;
}


function renderFoot() {
  const foot = $('#foot');
  foot.replaceChildren();
  if (finePointer) foot.append('Atajos: ', h('kbd', null, 'N'), ' escribir · ', h('kbd', null, '1'), '–', h('kbd', null, '4'), ' cambiar de vista · ', h('kbd', null, 'Esc'), ' cerrar');
}

/* ---------- avisos ---------- */
const toastEl = $('#toast'), toastText = $('#toastText'), toastBtn = $('#toastBtn');
let toastTimer = null, toastAction = null;
function toast(msg, actionLabel, action) {
  toastText.textContent = msg;
  toastAction = action || null;
  toastBtn.hidden = !action;
  toastBtn.textContent = actionLabel || '';
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.hidden = true; }, 5000);
}
toastBtn.addEventListener('click', () => { const a = toastAction; toastEl.hidden = true; if (a) a(); });

/* ---------- estado y cabecera ---------- */
function setStatus() {
  const s = $('#status');
  s.classList.remove('warn');
  if (store.mode === 'init') s.textContent = 'Conectando…';
  else if (store.mode === 'db') {
    if (store.online) s.textContent = 'Sincronizado';
    else if (store.everConnected) { s.textContent = 'Sin conexión · se guarda al volver'; s.classList.add('warn'); }
    else s.textContent = 'Conectando…';
  }
  else if (store.mode === 'local') { s.textContent = 'Guardado solo en este navegador'; s.classList.add('warn'); }
  else { s.textContent = 'No se pudo conectar. Revisa las reglas de Firebase'; s.classList.add('warn'); }
}
function setHeaderDate() {
  $('#todayText').textContent = today().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', '');
}
function changed() { setStatus(); render(); }

/* ---------- atajos ---------- */
document.addEventListener('keydown', e => {
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
  if (e.key === 'Escape' && ui.openId && !(t === capEl)) { ui.openId = null; if (typing) t.blur(); render(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/' || e.key === 'n') { e.preventDefault(); capEl.focus(); }
  else if (['1', '2', '3', '4'].includes(e.key)) switchTab(TABS[+e.key - 1].id);
});

let lastDay = ymd(today());
setInterval(() => { const d = ymd(today()); if (d !== lastDay) { lastDay = d; setHeaderDate(); render(); } }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { setHeaderDate(); render(); } });

/* ---------- arranque ---------- */
setHeaderDate();
setKind('task');
render();
if (finePointer) capEl.focus();
store.init();

})();
</script>
</body>
</html>
